[project]
name = "pcb-qa"
version = "0.1.0"
description = "Benchmarking LLM ability to analyse and answer questions about PCB circuit designs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "circuit-synth>=0.12.1",
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.10",
    "langchain-classic>=1.0.2",
    "langchain-ollama>=1.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "openrouter>=0.7.11",
    "pandas>=3.0.1",
    "pdfplumber>=0.11.9",
    "pyspice>=1.5",
    "reportlab>=4.4.9",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.3",
    "skidl>=2.2.1",
    "spyci>=1.0.2",
    "wget>=3.2",
    "pydantic>=2.0",
]

[project.scripts]
pcb-qa = "pcb_qa.__main__:main"
pcb-qa-evaluate = "pcb_qa.evaluation.evaluator:main"
pcb-qa-questions = "pcb_qa.question_banks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_qa"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
